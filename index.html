  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ใช้ Tailwind CSS สำหรับจัดหน้าตาแอป -->
  <script src="https://cdn.tailwindcss.com"></script>

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      padding-bottom: env(safe-area-inset-bottom);
      background-color: #f8fafc;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="bg-blue-600 text-white p-1.5 rounded-lg font-bold text-lg">DP</span>
        <div>
          <h1 id="app-title" class="font-bold text-lg leading-tight">ข่าวประจำวัน</h1>
          <p id="last-updated" class="text-xs text-slate-400">อัปเดตล่าสุด: --</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- ปุ่มเลือกภาษา 3 ภาษา -->
        <div class="flex bg-slate-800 rounded-lg p-0.5 text-xs font-semibold">
          <button onclick="changeLanguage('th')" id="lang-th" class="px-2.5 py-1.5 rounded-md bg-blue-600 text-white transition">TH</button>
          <button onclick="changeLanguage('en')" id="lang-en" class="px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white transition">EN</button>
          <button onclick="changeLanguage('zh')" id="lang-zh" class="px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white transition">中文</button>
        </div>

        <!-- ปุ่มกด Updated ข่าว -->
        <button onclick="refreshNews()" id="btn-update" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition">
          <svg id="update-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          <span id="update-text">อัปเดต</span>
        </button>
      </div>
    </div>

    <!-- แถบเลือก 5 หมวดหมู่ข่าว -->
    <nav class="bg-slate-800 border-t border-slate-700">
      <div class="max-w-5xl mx-auto px-4 flex overflow-x-auto no-scrollbar py-2 gap-2" id="category-tabs">
        <!-- ปุ่มหมวดหมู่จะถูกสร้างด้วย JavaScript -->
      </div>
    </nav>
  </header>

  <!-- พื้นที่แสดงรายการข่าว -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-5">
    <div id="loading-state" class="hidden py-12 text-center text-slate-500">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-2"></div>
      <p id="loading-text">กำลังดึงข้อมูลข่าวล่าสุด...</p>
    </div>

    <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- การ์ดข่าวจะถูกสร้างด้วย JavaScript (อย่างน้อย 6 ข่าวต่อหมวด) -->
    </div>
  </main>

  <!-- หน้าต่างแสดงรายละเอียดข่าว (Modal) -->
  <div id="news-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-2xl rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl animate-fade-in">
      <div class="relative h-56 sm:h-64 bg-slate-200 shrink-0">
        <img id="modal-img" src="" alt="News Image" class="w-full h-full object-cover">
        <button onclick="closeModal()" class="absolute top-3 right-3 bg-black/60 text-white w-9 h-9 rounded-full flex items-center justify-center hover:bg-black/80 text-lg font-bold">✕</button>
        <span id="modal-category" class="absolute bottom-3 left-3 bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-md shadow"></span>
      </div>

      <div class="p-5 overflow-y-auto space-y-3">
        <p id="modal-date" class="text-xs text-slate-400 font-medium"></p>
        <h2 id="modal-title" class="text-xl font-bold text-slate-900 leading-snug"></h2>
        <div id="modal-content" class="text-slate-700 text-sm leading-relaxed space-y-2 pt-2 border-t border-slate-100"></div>
      </div>

      <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center shrink-0">
        <a id="modal-link" href="#" target="_blank" rel="noopener" class="text-blue-600 hover:underline text-sm font-semibold">อ่านต้นฉบับเต็ม ↗</a>
        <button onclick="closeModal()" id="modal-close-btn" class="bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-700">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>

            ["知名歌手正式官宣年度巡回演唱会，舞美设计全面升级", "此次巡演将覆盖十余座城市，采用沉浸式环绕音响与巨型LED天幕，为歌迷带来视听盛宴。"],
            ["热门古装与现代都市剧集在海外流媒体平台收获好评", "精良的服化道制作与引发共鸣的情感故事，让多部剧集成功登上多国流媒体热播榜单。"],
            ["国际电影节公布主竞赛单元入围名单，佳作云集", "多位青年导演的处女作与资深影人的新作同台角逐，涵盖了家庭剧情、纪录片与动画等多种类型。"],
            ["户外音乐节阵容揭晓，融合流行、摇滚与独立音乐", "主办方同时设置了艺术装置区与创意市集，打造兼具音乐欣赏与休闲社交的周末文化空间。"],
            ["传统戏曲与现代数字光影技术结合，创新舞台剧场座无虚席", "通过全息投影与新编曲目，古老艺术焕发出全新魅力，吸引了大量年轻观众走进剧场。"],
            ["畅销科幻小说确认改编为同名影视剧，概念海报首度曝光", "主创团队表示将高度还原原著中的宏大世界观，目前已进入前期美术设计与选角阶段。"]
          ],
          technology: [
            ["新一代多模态人工智能模型发布，推理与创作能力大幅跃升", "该模型支持超长文本解析、代码编写及实时语音交互，并可在企业办公与科研领域提供高效辅助。"],
            ["固态电池研发取得新突破，新能源汽车续航与充电速度双提升", "实验室数据显示，新型电解质材料有效提升了电池安全性与能量密度，商业化量产进程正在加快。"],
            ["智能手机迎来端侧AI普及潮，离线也能实现实时翻译与修图", "搭载新一代神经网络芯片的移动设备，不仅提升了运行速度，还进一步保障了用户的本地数据隐私。"],
            ["人形机器人与智能制造装备在工业流水线展开实景测试", "具备高精度视觉识别与灵活机械臂的机器人，已能够协助完成零件分拣、组装及质量检测等复杂任务。"],
            ["网络安全专家提醒防范新型AI语音与视频合成诈骗", "建议公众在涉及资金转账时务必通过多重渠道核实身份，并开启账户的双重身份验证功能。"],
            ["低轨卫星互联网技术持续演进，偏远地区与航空网络更畅通", "随着更多通信卫星顺利入轨组网，海洋航行、沙漠科考及民航客机上的高速上网体验得到显著改善。"],
            ["开源软件生态蓬勃发展，AI编程助手成为开发者标配工具", "调查显示，超过七成的软件工程师在日常开发中使用智能代码补全与测试工具，大幅缩短了项目周期。"]
          ]
        }
      };

      const list = templates[lang][category] || templates['th'][category];
      const now = new Date();
      return list.map((item, idx) => {
        const itemDate = new Date(now.getTime() - idx * 3600 * 1000);
        return {
          id: `${lang}-${category}-${idx}`,
          title: item[0],
          summary: item[1],
          content: `<p>${item[1]}</p><p class="mt-3">รายงานข่าวระบุเพิ่มเติมว่า แนวโน้มดังกล่าวได้รับความสนใจจากทั้งภาครัฐและเอกชน ซึ่งมีการติดตามสถานการณ์อย่างใกล้ชิดเพื่อประเมินผลกระทบและโอกาสในการพัฒนาต่อไปในอนาคต</p>`,
          pubDate: itemDate.toLocaleDateString(lang === 'th' ? 'th-TH' : lang === 'zh' ? 'zh-CN' : 'en-US', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          }),
          image: categoryImages[category][idx % categoryImages[category].length],
          link: "https://news.google.com"
        };
      });
    }

    // --- 4. สถานะการทำงานของแอป ---
    let currentLang = localStorage.getItem('dp_lang') || 'th';
    let currentCategory = 'economy';
    const categories = ['economy', 'politics', 'sports', 'entertainment', 'technology'];
    let newsCache = {};

    // --- 5. ฟังก์ชันหลักในการดึงข่าวและแสดงผล ---
    async function fetchCategoryNews(lang, category, forceRefresh = false) {
      const cacheKey = `${lang}_${category}`;
      if (!forceRefresh && newsCache[cacheKey] && newsCache[cacheKey].length >= 6) {
        return newsCache[cacheKey];
      }

      const fallbackItems = generateFallbackNews(lang, category);
      const rssUrl = rssFeeds[lang]?.[category];
      if (!rssUrl) {
        newsCache[cacheKey] = fallbackItems;
        return fallbackItems;
      }

      try {
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const response = await fetch(apiUrl);
        const data = await response.json();

        if (data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
          const liveItems = data.items.map((item, idx) => {
            const cleanDesc = (item.description || item.content || '').replace(/<[^>]+>/g, '').trim();
            return {
              id: `live-${lang}-${category}-${idx}`,
              title: item.title,
              summary: cleanDesc.length > 20 ? cleanDesc : fallbackItems[idx % fallbackItems.length].summary,
              content: `<p>${cleanDesc || item.title}</p><p class="mt-3 text-slate-500 text-xs">${item.author ? 'Source: ' + item.author : ''}</p>`,
              pubDate: item.pubDate ? new Date(item.pubDate).toLocaleString(lang === 'th' ? 'th-TH' : lang === 'zh' ? 'zh-CN' : 'en-US') : fallbackItems[0].pubDate,
              image: item.thumbnail || item.enclosure?.link || categoryImages[category][idx % categoryImages[category].length],
              link: item.link || "https://news.google.com"
            };
          });

          // การันตีว่ามีอย่างน้อย 6 ข่าวเสมอ หาก RSS ส่งมาน้อยกว่า 6 ให้เติมจากรายการสำรอง
          while (liveItems.length < 6) {
            liveItems.push(fallbackItems[liveItems.length]);
          }

          newsCache[cacheKey] = liveItems;
          return liveItems;
        }
      } catch (err) {
        console.warn("Using fallback news due to network/CORS:", err);
      }

      newsCache[cacheKey] = fallbackItems;
      return fallbackItems;
    }

    function updateUIText() {
      const t = i18n[currentLang];
      document.getElementById('app-title').textContent = t.appTitle;
      document.getElementById('update-text').textContent = t.updateBtn;
      document.getElementById('loading-text').textContent = t.loading;
      document.getElementById('modal-close-btn').textContent = t.closeBtn;
      document.getElementById('modal-link').textContent = t.readSource;

      // ไฮไลต์ปุ่มภาษา
      ['th', 'en', 'zh'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (l === currentLang) {
          btn.className = "px-2.5 py-1.5 rounded-md bg-blue-600 text-white transition";
        } else {
          btn.className = "px-2.5 py-1.5 rounded-md text-slate-300 hover:text-white transition";
        }
      });

      // สร้างแท็บ 5 หมวดหมู่
      const tabsContainer = document.getElementById('category-tabs');
      tabsContainer.innerHTML = categories.map(cat => {
        const isActive = cat === currentCategory;
        return `
          <button onclick="selectCategory('${cat}')"
            class="px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition ${
              isActive ? 'bg-blue-600 text-white shadow' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'
            }">
            ${t.categories[cat]}
          </button>
        `;
      }).join('');

      updateTimestamp();
    }

    function updateTimestamp() {
      const t = i18n[currentLang];
      const now = new Date();
      const timeStr = now.toLocaleTimeString(currentLang === 'th' ? 'th-TH' : currentLang === 'zh' ? 'zh-CN' : 'en-US', {
        hour: '2-digit', minute: '2-digit'
      });
      const dateStr = now.toLocaleDateString(currentLang === 'th' ? 'th-TH' : currentLang === 'zh' ? 'zh-CN' : 'en-US', {
        day: 'numeric', month: 'short', year: 'numeric'
      });
      document.getElementById('last-updated').textContent = `${t.lastUpdated} ${dateStr} ${timeStr}`;
    }

    async function renderNews(forceRefresh = false) {
      const grid = document.getElementById('news-grid');
      const loader = document.getElementById('loading-state');
      const t = i18n[currentLang];

      grid.classList.add('hidden');
      loader.classList.remove('hidden');

      const articles = await fetchCategoryNews(currentLang, currentCategory, forceRefresh);

      loader.classList.add('hidden');
      grid.classList.remove('hidden');

      grid.innerHTML = articles.map((item, idx) => `
        <article onclick="openArticle(${idx})" class="bg-white rounded-xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col cursor-pointer hover:shadow-md active:scale-[0.99] transition">
          <div class="h-44 bg-slate-200 relative overflow-hidden">
            <img src="${item.image}" alt="" loading="lazy" onerror="this.src='${categoryImages[currentCategory][0]}'" class="w-full h-full object-cover">
            <span class="absolute top-2.5 left-2.5 bg-slate-900/80 backdrop-blur-sm text-white text-[11px] font-semibold px-2.5 py-0.5 rounded">
              ${t.categories[currentCategory]}
            </span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <p class="text-[11px] text-slate-400 mb-1">${item.pubDate}</p>
              <h3 class="font-bold text-slate-900 text-base leading-snug line-clamp-2 mb-2">${item.title}</h3>
              <p class="text-slate-600 text-xs leading-relaxed line-clamp-3">${item.summary}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-blue-600 text-xs font-semibold">${t.readMore}</span>
              <span class="text-slate-400 text-xs">#${idx + 1}</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    // --- 6. ฟังก์ชันควบคุมการกดปุ่มของผู้ใช้ ---
    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('dp_lang', lang);
      updateUIText();
      renderNews(false);
    }

    function selectCategory(category) {
      currentCategory = category;
      updateUIText();
      renderNews(false);
    }

    async function refreshNews() {
      const icon = document.getElementById('update-icon');
      const text = document.getElementById('update-text');
      const t = i18n[currentLang];

      icon.classList.add('animate-spin');
      text.textContent = t.updating;

      // ล้างแคชของหมวดปัจจุบันแล้วดึงข้อมูลสดใหม่
      delete newsCache[`${currentLang}_${currentCategory}`];
      await renderNews(true);
      updateTimestamp();

      setTimeout(() => {
        icon.classList.remove('animate-spin');
        text.textContent = t.updateBtn;
      }, 400);
    }

    async function openArticle(index) {
      const articles = await fetchCategoryNews(currentLang, currentCategory, false);
      const item = articles[index];
      if (!item) return;

      const t = i18n[currentLang];
      document.getElementById('modal-img').src = item.image;
      document.getElementById('modal-category').textContent = t.categories[currentCategory];
      document.getElementById('modal-date').textContent = item.pubDate;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-content').innerHTML = item.content;
      document.getElementById('modal-link').href = item.link;

      document.getElementById('news-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('news-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    // --- 7. ลงทะเบียน Service Worker สำหรับ PWA ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    // เริ่มต้นทำงานเมื่อเปิดแอป
    updateUIText();
    renderNews(false);
  </script>
</body>
</html>
